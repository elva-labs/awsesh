name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build --single --skip-install

      - name: Build SDK
        run: bun run build:sdk

  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install ARM64 Rust toolchain
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/desktop/Cargo.toml --check

      - name: Test Rust application
        run: cargo test --manifest-path packages/desktop/Cargo.toml --locked

      - name: Build ad-hoc desktop bundle
        run: bun run build:desktop

      - name: Verify desktop bundle
        run: |
          app=packages/desktop/dist/Sesh.app
          codesign --force --sign - --options runtime --timestamp=none --entitlements packages/desktop/assets/entitlements.plist "$app/Contents/MacOS/awsesh-sdk"
          codesign --force --sign - --options runtime --timestamp=none "$app"
          codesign --verify --strict "$app/Contents/MacOS/awsesh-sdk"
          codesign --verify --deep --strict "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" == "13.0" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" == "AppIcon.icns" ]] || exit 1
          cmp packages/desktop/assets/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          for name in sesh awsesh-sdk; do
            [[ "$(lipo -archs "$app/Contents/MacOS/$name")" == "arm64" ]]
            vtool -show-build "$app/Contents/MacOS/$name" | grep -E 'minos 13\.0$'
          done
          bun --eval '
          import { $ } from "bun"
          import assert from "node:assert/strict"
          import { generateKeyPairSync, randomBytes } from "node:crypto"
          import { mkdtemp, rm } from "node:fs/promises"
          import path from "node:path"
          import { decodeNotaryKey, keychainSearchList, verifyHelper } from "./packages/desktop/script/release.ts"
          import { desktopArchive, validateDesktopArchive } from "./packages/scripts/release.ts"
          const key = generateKeyPairSync("ec", { namedCurve: "prime256v1" }).privateKey.export({ type: "pkcs8", format: "pem" }).toString()
          const encoded = Buffer.from(key).toString("base64")
          assert.equal(decodeNotaryKey(encoded), key.trim())
          assert.equal(decodeNotaryKey(encoded.replace(/.{64}/g, "$&\n")), key.trim())
          assert.throws(() => decodeNotaryKey(encoded + "!"))
          assert.throws(() => decodeNotaryKey(Buffer.from("invalid key").toString("base64")))
          const rsa = generateKeyPairSync("rsa", { modulusLength: 2048 }).privateKey.export({ type: "pkcs8", format: "pem" }).toString()
          assert.throws(() => decodeNotaryKey(Buffer.from(rsa).toString("base64")))
          const temporary = process.env.RUNNER_TEMP
          if (!temporary) throw new Error("RUNNER_TEMP is required")
          const directory = await mkdtemp(path.join(temporary, "awsesh-helper-verification-"))
          const app = path.resolve("packages/desktop/dist/Sesh.app")
          const archive = path.join(directory, desktopArchive)
          const search = await keychainSearchList()
          const keychain = path.join(directory, "signing.keychain-db")
          const password = randomBytes(32).toString("hex")
          try {
            await $`iconutil -c iconset ${path.join(app, "Contents/Resources/AppIcon.icns")} -o ${path.join(directory, "AppIcon.iconset")}`.quiet()
            await $`security create-keychain -p ${password} ${keychain}`.quiet()
            await $`security list-keychains -d user -s ${keychain} ${search}`.quiet()
            assert.deepEqual(await keychainSearchList(), [keychain, ...search])
            await verifyHelper(path.join(app, "Contents/MacOS/awsesh-sdk"), directory)
            await $`ditto -c -k --sequesterRsrc --keepParent ${app} ${archive}`
            await validateDesktopArchive(archive)
          } finally {
            try {
              if (await Bun.file(keychain).exists()) await $`security delete-keychain ${keychain}`.quiet()
              assert.deepEqual(await keychainSearchList(), search)
            } finally {
              await rm(directory, { recursive: true, force: true })
            }
          }
          '
