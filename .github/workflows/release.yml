name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation:
        description: "Stage from main, or publish from the candidate tag"
        required: true
        type: choice
        options: [stage, publish]
      tag:
        description: "Prepared tag, for example v1.1.0 or v1.1.0-beta.1"
        required: true
        type: string

concurrency:
  group: awsesh-release-control
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWSESH_TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  desktop-windows:
    if: github.repository == 'elva-labs/awsesh' && (github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.operation == 'stage'))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select approved tagged source
        shell: bash
        run: |
          [[ "$AWSESH_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]
          commit=$(git rev-parse --verify "refs/tags/$AWSESH_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows package
        run: bun run build:desktop

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: awsesh-desktop-win32-x64
          path: packages/desktop/dist/awsesh-desktop-win32-x64.zip
          retention-days: 1

  stage:
    if: github.repository == 'elva-labs/awsesh' && (github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.operation == 'stage'))
    needs: desktop-windows
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select approved tagged source
        id: source
        run: |
          [[ "$AWSESH_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]
          commit=$(git rev-parse --verify "refs/tags/$AWSESH_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install ARM64 Rust toolchain
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Freeze notes at the tagged commit
        id: notes
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0
        with:
          dry-run: true
          commitish: ${{ steps.source.outputs.commit }}
          tag: ${{ env.AWSESH_TAG }}

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: awsesh-desktop-win32-x64
          path: packages/desktop/dist

      - name: Stage and verify candidate artifacts
        run: bun run packages/scripts/publish-start.ts --skip-install
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

  publish:
    if: github.repository == 'elva-labs/awsesh' && github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_name == inputs.tag && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select approved tagged source
        run: |
          [[ "$AWSESH_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$AWSESH_TAG" ]]
          commit=$(git rev-parse --verify "refs/tags/$AWSESH_TAG^{commit}")
          [[ "$GITHUB_SHA" == "$commit" ]]
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish verified staged artifacts
        run: bun run packages/scripts/publish-complete.ts
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Preserve other frozen candidates
        id: candidate
        run: |
          drafts=$(gh api --paginate repos/elva-labs/awsesh/releases --jq '.[] | select(.draft and .tag_name != "upcoming") | .tag_name')
          if [[ -z "$drafts" ]]; then
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0
        if: steps.candidate.outputs.update == 'true'
        with:
          commitish: main
          footer: "\n[Full changelog](https://github.com/elva-labs/awsesh/compare/$PREVIOUS_TAG...main)\n"
