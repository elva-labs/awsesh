name: Release

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'elva-labs/awsesh'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Git Identity
        run: |
          git config --global user.email "gh-bot@elva-group.com"
          git config --global user.name "elva-bot"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Install rcodesign
        env:
          RCODESIGN_VERSION: "0.29.0"
          RCODESIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
        run: |
          archive="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/rcodesign.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${archive}.tar.gz"
          echo "${RCODESIGN_SHA256}  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/${archive}/rcodesign" /usr/local/bin/rcodesign

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun run test

      - name: Publish
        id: publish
        run: ./packages/scripts/publish-start.ts
        env:
          AWSESH_BUMP: ${{ inputs.bump }}
          AWSESH_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: awsesh-cli
          path: packages/awsesh/dist

    outputs:
      release: ${{ steps.publish.outputs.release }}
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}

  publish-release:
    needs: publish
    if: needs.publish.outputs.tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Git Identity
        run: |
          git config --global user.email "gh-bot@elva-group.com"
          git config --global user.name "elva-bot"

      - name: Install Dependencies
        run: bun install

      - run: ./packages/scripts/publish-complete.ts
        env:
          AWSESH_VERSION: ${{ needs.publish.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
