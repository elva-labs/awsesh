[package]
name = "awsesh-desktop"
version = "1.0.19"
edition = "2024"
publish = false

[[bin]]
name = "sesh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
chrono = "0.4"
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"

[profile.release]
strip = true
lto = "thin"
