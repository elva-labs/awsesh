[package]
name = "awsesh-desktop"
version = "1.5.1"
edition = "2024"
publish = false

[[bin]]
name = "sesh"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
anyhow = "1"
rune = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf", default-features = false }
chrono = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf" }
winit = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4c4abf5d6d2b47892b3b01c519341b943f5cebcf" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
