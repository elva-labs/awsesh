<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <title>Sesh application icon</title>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0.3" y2="1">
